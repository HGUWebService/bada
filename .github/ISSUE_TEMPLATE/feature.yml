name: 기능 작업
description: 기능 요구사항(F번호) 단위의 작업
title: "[F?] "
labels: [feature]
body:
  - type: input
    id: requirement
    attributes:
      label: 기능 요구사항 번호
      description: 설계보고서 기능 요구사항 표의 번호
      placeholder: F3
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: [backend, frontend, backend + frontend]
  - type: textarea
    id: goal
    attributes:
      label: 작업 내용
      description: 사용자 동작과 Backend 처리
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: 관련 API / 화면
      placeholder: "POST /api/beaches, S3 해변 관리"
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: |
        - [ ] Swagger 또는 화면에서 예상 결과 확인
        - [ ] 다른 팀원 리뷰 승인 + CI 통과
        - [ ] develop에 merge
        - [ ] API가 바뀌었다면 docs/ 명세 갱신
