spring:
  application:
    name: bada
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/bada}
    username: ${DB_USERNAME:bada}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}
